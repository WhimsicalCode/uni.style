name: Release

# Releases UniStyle when a GitHub release is published:
#
#   gh release create v1.0.0 --repo WhimsicalCode/uni.style --target main --notes-file notes.md
#
# The release's commit must be on main, its tag must match VERSION, and
# CHANGELOG.md must date it. After the tests, deploys com.whimsical/uni.style
# to Clojars in the release environment, whose required reviewer approves the
# deployment and which holds the CLOJARS_USERNAME and CLOJARS_DEPLOY_TOKEN
# secrets. Clojars has no staging, the version is public right away.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release's commit $GITHUB_SHA isn't on main"
            exit 1
          fi
          version=$(cat VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag $TAG doesn't match VERSION $version"
            exit 1
          fi
          if ! grep -qE "^## $version \[[0-9]{4}-[0-9]{2}-[0-9]{2}\]$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md doesn't date $version (## $version [YYYY-MM-DD])"
            exit 1
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.11.1.1155

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Tests
        run: script/test

      - name: Clojars artifact test
        run: script/test-clojars

  clojars:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.11.1.1155

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: script/clojars deploy
